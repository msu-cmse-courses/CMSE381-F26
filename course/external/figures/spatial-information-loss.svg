<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#444" stroke-width="1.8"/>
    </marker>
    <style>
      .heading { font: 700 30px Arial, sans-serif; fill: #20252b; }
      .subhead { font: 700 23px Arial, sans-serif; fill: #20252b; }
      .body { font: 20px Arial, sans-serif; fill: #303840; }
      .small { font: 17px Arial, sans-serif; fill: #59636e; }
      .matrixnum { font: 700 35px Arial, sans-serif; fill: #20252b; }
      .resultnum { font: 700 38px Arial, sans-serif; fill: #20252b; }
      .cell { stroke: #536170; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="690" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" class="heading">When Location Matters: Spatial Information Loss</text>
  <text x="600" y="88" text-anchor="middle" class="body">Two different feature maps encode an abnormality in different locations</text>

  <!-- Input A -->
  <text x="300" y="150" text-anchor="middle" class="subhead">Image A</text>
  <text x="300" y="181" text-anchor="middle" class="small">Abnormality in upper-left</text>
  <g transform="translate(190,205)">
    <rect x="0" y="0" width="100" height="100" fill="#f2c66d" class="cell"/>
    <rect x="100" y="0" width="100" height="100" fill="#eef1f4" class="cell"/>
    <rect x="0" y="100" width="100" height="100" fill="#eef1f4" class="cell"/>
    <rect x="100" y="100" width="100" height="100" fill="#eef1f4" class="cell"/>
    <text x="50" y="65" text-anchor="middle" class="matrixnum">1</text>
    <text x="150" y="65" text-anchor="middle" class="matrixnum">0</text>
    <text x="50" y="165" text-anchor="middle" class="matrixnum">0</text>
    <text x="150" y="165" text-anchor="middle" class="matrixnum">0</text>
  </g>

  <!-- Input B -->
  <text x="900" y="150" text-anchor="middle" class="subhead">Image B</text>
  <text x="900" y="181" text-anchor="middle" class="small">Abnormality in lower-right</text>
  <g transform="translate(790,205)">
    <rect x="0" y="0" width="100" height="100" fill="#eef1f4" class="cell"/>
    <rect x="100" y="0" width="100" height="100" fill="#eef1f4" class="cell"/>
    <rect x="0" y="100" width="100" height="100" fill="#eef1f4" class="cell"/>
    <rect x="100" y="100" width="100" height="100" fill="#f2c66d" class="cell"/>
    <text x="50" y="65" text-anchor="middle" class="matrixnum">0</text>
    <text x="150" y="65" text-anchor="middle" class="matrixnum">0</text>
    <text x="50" y="165" text-anchor="middle" class="matrixnum">0</text>
    <text x="150" y="165" text-anchor="middle" class="matrixnum">1</text>
  </g>

  <!-- Pooling operation -->
  <path d="M300 430 L300 475 L475 475" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M900 430 L900 475 L725 475" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="440" y="445" width="320" height="65" rx="12" fill="#e8edf2" stroke="#73808d" stroke-width="2"/>
  <text x="600" y="485" text-anchor="middle" class="subhead">Global max pooling</text>

  <!-- Outputs -->
  <path d="M520 510 L520 545 L390 545" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M680 510 L680 545 L810 545" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(320,555)">
    <rect x="0" y="0" width="140" height="70" rx="10" fill="#dcebdc" stroke="#56845a" stroke-width="2"/>
    <text x="70" y="46" text-anchor="middle" class="resultnum">1</text>
    <text x="70" y="95" text-anchor="middle" class="small">Output A</text>
  </g>
  <g transform="translate(740,555)">
    <rect x="0" y="0" width="140" height="70" rx="10" fill="#dcebdc" stroke="#56845a" stroke-width="2"/>
    <text x="70" y="46" text-anchor="middle" class="resultnum">1</text>
    <text x="70" y="95" text-anchor="middle" class="small">Output B</text>
  </g>

  <text x="600" y="665" text-anchor="middle" class="subhead" fill="#9b3434">Different locations → identical pooled representations</text>
</svg>